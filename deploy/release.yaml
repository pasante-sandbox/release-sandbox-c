# Release policy, read by the release control service at the commit being deployed.
# app: defaults to the repository name.
owner: sandbox

environments:
  stg:
    approvals: 0
  preprod:
    approvals: 1          # the tester, in the Ops Platform, after testing on stg
  prod:
    approvals: 1          # the same tester, after testing in preprod
    production: true
    manualRelease: true   # then the developer is told, and releases it in the Ops Platform